<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a111b"><title>星轨 · 管理后台</title><link rel="icon" type="image/svg+xml" href="/assets/admin-control.svg"><link rel="apple-touch-icon" sizes="180x180" href="/assets/admin-icon-180.png?v=1"><link rel="manifest" href="/assets/admin.webmanifest?v=1"><meta name="apple-mobile-web-app-title" content="星轨后台"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="stylesheet" href="/assets/admin.css"><script defer src="/assets/admin.js"></script></head><body><p class="desktopNotice">请使用手机打开管理后台</p><main><header><span class="seal"><img src="/assets/admin-control.svg" alt="星轨控制舱" width="64" height="64"></span><div><small>ORBIT CONTROL</small><h1>管理后台</h1></div><button id="logout" hidden>退出</button></header><form id="login"><div class="adminLoginMark"><img src="/assets/admin-control.svg" alt="星轨控制舱标识" width="108" height="108"><strong>星轨 · 控制舱</strong></div><h2>管理员登录</h2><label>账号<input name="username" autocomplete="username" required maxlength="64"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><button class="primary" type="submit">登录后台</button></form><section id="dashboard" hidden><div class="stats"><article><span>用户总数</span><strong id="total">—</strong><small>已注册账户</small></article><article><span>近期在线</span><strong id="online">—</strong><small>最近 2 分钟活跃</small></article></div><section class="control"><span class="eyebrow">SESSION CONTROL</span><h2>登录会话管理</h2><p>让所有普通用户退出登录，保留账户、自选和持仓。</p><button id="offline" class="danger" type="button">一键全部下线</button><small>在线用户下次检测时退出，离线用户下次打开时重新登录。管理后台保持登录。</small></section><section class="userSection"><h2>用户账号</h2><div id="users"></div></section><section class="regionSection"><h2>IP 归属地统计</h2><div id="regions"></div></section><button id="refresh" class="refresh" type="button">刷新人数</button><time id="updated"></time></section><p id="message" role="status" aria-live="polite"></p><footer>星轨 · 管理员专用</footer></main><dialog id="banDialog" aria-labelledby="banTitle"><form id="banForm"><h2 id="banTitle">封禁账号</h2><p id="banTarget"></p><label>封禁理由<select id="banReason" required><option value="">请选择理由</option></select></label><label id="banNoteLabel" hidden>说明<textarea id="banNote" maxlength="120" rows="3" placeholder="填写封禁原因"></textarea></label><p id="banError" role="status"></p><div class="banActions"><button id="banCancel" type="button">取消</button><button class="danger" type="submit">确认封禁</button></div></form></dialog></body></html>
